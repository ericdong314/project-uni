services:
  web:
    build:
      context: .
      target: prod
    entrypoint:
      - /src/entrypoint.sh
    command:
      - gunicorn
      - -c
      - ./gunicorn.conf.py
    volumes:
      - static_volume:/src/staticfiles/
    env_file:
      - ./.env.prod
    ports:
      - "8888:8888"
  db:
    env_file:
      - ./.env.prod
    volumes:
      - db_volume_prod:/var/lib/postgresql/
  nginx:
    container_name: nginx
    image: nginx:1.31
    volumes:
      - static_volume:/var/www/staticfiles/
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  static_volume:
  db_volume_prod: