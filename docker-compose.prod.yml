services:
  web:
    build:
      context: .
      target: prod
    entrypoint:
      - /src/collect_and_step_down.sh
    command:
      - gunicorn
      - -c
      - ./gunicorn.conf.py
    volumes:
      - static-volume:/src/staticfiles/
    env_file:
      - ./.env.prod
    ports:
      - "8888:8888"
  db:
    env_file:
      - ./.env.prod
  nginx:
    container_name: nginx
    image: nginx:1.31
    volumes:
      - static-volume:/var/www/staticfiles/
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9000:80"
    depends_on:
      - web

volumes:
  static-volume: