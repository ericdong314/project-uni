services:
  web:
    container_name: uni
    build: .
    entrypoint:
      - /src/collect_and_step_down.sh
    command:
      - gunicorn
      - -c
      - ./gunicorn.conf.py
    ports:
      - "8888:8888"
    env_file:
      - ./.env.dev
    volumes:
      - static-volume:/src/staticfiles/
    depends_on:
      - db
  db:
    container_name: db
    image: postgres:18
    restart: unless-stopped
    env_file:
      - ./.env.dev
    volumes:
      - db-data:/var/lib/postgresql/
    ports:
      - "5432:5432"
  nginx:
    container_name: nginx
    image: nginx:1.31
    volumes:
      - static-volume:/var/www/staticfiles/
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9000:80"
    depends_on:
      - web

volumes:
  db-data:
  static-volume: