services:
  web:
    container_name: uni
    build: .
    command: gunicorn --bind :8888 uni.wsgi:application
    ports:
     - "8888:8888"
    env_file:
      - ./.env.dev
    volumes:
      - ./src/db.sqlite3:/home/nonroot/db.sqlite3
      - ./src:/src
    depends_on:
      - db
  db:
    container_name: db
    image: postgres:18
    restart: unless-stopped
    env_file:
      - ./.env.dev
    volumes:
      - db-data:/var/lib/postgresql/
    ports:
      - "5432:5432"
  nginx:
    container_name: nginx
    image: nginx:1.31
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9000:80"
    depends_on:
      - web

volumes:
  db-data: