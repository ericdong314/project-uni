services:
  web:
    container_name: uni
    build: .
    command: python3 manage.py runserver 0.0.0.0:8888
    ports:
     - "8888:8888"
    env_file:
      - ./.env.dev
    volumes:
      - ./src/db.sqlite3:/home/nonroot/db.sqlite3
      - ./src:/src
  db:
    container_name: db
    image: postgres:18
    restart: unless-stopped
    env_file:
      - ./.env.dev
    volumes:
      - db-data:/var/lib/postgresql/
    ports:
      - "5432:5432"

volumes:
  db-data: