<html lang="en">
<title>Klipper</title>
{% if item_list %}
    <ol>
        {% for item in item_list %}
            <li>{{ item.link }}</li>
        {% endfor %}
    </ol>
{% endif %}
<form action="" method="post">
    {% csrf_token %}
    <table>{{ form.as_table }}</table>
    <input type="submit" value="Confirm">
</form>
</html>
