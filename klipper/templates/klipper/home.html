{% extends 'klipper/base_generic.html' %}
{% block content %}
    <form action="" method="post">
        {% csrf_token %}
        <table>{{ form.as_table }}</table>
        <input type="submit" value="Add">
    </form>
    {% if item_list %}
        <ol id="id_item_list">
            {% for item in item_list %}
                <li>{{ item.link }}</li>
            {% endfor %}
        </ol>
    {% endif %}
{% endblock %}
